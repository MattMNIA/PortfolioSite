# Deploys mattmn.com on every push to main.
#
# The droplet has 960MB RAM and cannot run a CRA build, so CI builds and
# ships the result. Deploys are atomic: upload to a new release directory,
# then flip the /srv/mattmn/current symlink.
#
# Required repo secrets:
#   DEPLOY_SSH_KEY      private key for the `deploy` user on the droplet
#   DEPLOY_HOST         mattmn.com
#   DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan mattmn.com
name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: mattmn
  BUILD_DIR: client/build
  WORK_DIR: client

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build
        env:
          CI: false          # CRA fails the build on warnings otherwise

      - name: Verify build
        run: |
          test -f "$BUILD_DIR/index.html" \
            || { echo "No index.html in $BUILD_DIR"; exit 1; }
          echo "Build OK: $(find "$BUILD_DIR" -type f | wc -l) files"

      - name: Set up SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload release
        run: |
          RELEASE="${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          ssh deploy@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p /srv/$APP_NAME/releases/$RELEASE"
          rsync -az --delete \
            "$BUILD_DIR"/ \
            deploy@${{ secrets.DEPLOY_HOST }}:/srv/$APP_NAME/releases/$RELEASE/

      - name: Activate release
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} \
            "activate-release $APP_NAME $RELEASE"

      - name: Smoke test
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://mattmn.com)
          echo "https://mattmn.com -> $code"
          [ "$code" = "200" ] || exit 1
